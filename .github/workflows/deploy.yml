name: Build and Deploy Hugo Site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Automatically pulls your Blowfish theme submodule files
          fetch-depth: 0         # Required for Blowfish to read post modification dates from git

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true         # Required to process Blowfish's SCSS files

      - name: Build production site
        run: hugo --gc --minify

      - name: Deploy built files via SSH/Rsync
        uses: easingthemes/ssh-deploy@v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "public/"
          TARGET: ${{ secrets.SSH_TARGET_DIR }}
          ARGS: "-rlgoDzvc --delete"
